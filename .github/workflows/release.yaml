name: build image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/eyenx/blog
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=schedule,pattern=nightly
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Login to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        id: login
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        id: build
        with:
          image: blog
          layers: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          containerfiles: |
            ./Containerfile

      - name: Echo Results
        run: | # zizmor: ignore[template-injection]
          echo "Image: ${{ steps.build.outputs.image }}"
          echo "Tags: ${{ steps.build.outputs.tags }}"
          echo "Tagged Image: ${{ steps.build.outputs.image-with-tag }}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
        with:
          image-ref: "${{ steps.build.outputs.image-with-tag }}"
          format: "json"
          ignore-unfixed: true
          list-all-pkgs: true
          output: "trivy.json"
          scanners: "vuln"

      - name: Convert trivy results to sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy.json
          scan-type: "convert"
          format: "sarif"
          limit-severities-for-sarif: true
          vuln-type: ""
          output: "trivy.sarif"

      - name: Convert trivy results to CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy.json
          scan-type: "convert"
          format: "cyclonedx"
          limit-severities-for-sarif: true
          vuln-type: ""
          output: "trivy.cdx"

      - name: Convert trivy results to cosign-vuln
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy.json
          scan-type: "convert"
          format: "cosign-vuln"
          limit-severities-for-sarif: true
          vuln-type: ""
          output: "trivy.cosign.json"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          sarif_file: "trivy.sarif"

      - name: Push
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/eyenx

      - name: Sign the image with GitHub OIDC Token using cosign
        run: | # zizmor: ignore[template-injection]
          cosign sign --yes ${{ steps.build.outputs.image-with-tag }}@${{ steps.push.outputs.digest }}
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Attach an SBOM attestation to the signed image
        run: | # zizmor: ignore[template-injection]
          cosign attest --yes --type cyclonedx --predicate trivy.cdx ${{ steps.build.outputs.image-with-tag }}@${{ steps.push.outputs.digest }}
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Attach a security attestation to the signed image
        run: | # zizmor: ignore[template-injection]
          cosign attest --yes --type vuln --predicate trivy.cosign.json ${{ steps.build.outputs.image-with-tag }}@${{ steps.push.outputs.digest }}
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        id: attest
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
