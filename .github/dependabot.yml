version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
    cooldown:
      default-days: 7
  - package-ecosystem: bundler
    directory: "/src"
    schedule:
      interval: daily
      time: "05:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
    cooldown:
      default-days: 7
